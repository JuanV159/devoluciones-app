spring:
  datasource:
    url: jdbc:h2:mem:devoluciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Schema + cargas sin seed PostgreSQL (setval).
    locations: classpath:db/test-migration

app:
  jwt:
    secret: test-secret-at-least-256-bits-long-0123456789abcdef0123456789
    expiration-minutes: 60
  carga:
    dir: ./cargas
    max-filas: 50000
    chunk-size: 100
