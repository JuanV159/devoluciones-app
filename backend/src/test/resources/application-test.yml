spring:
  datasource:
    url: jdbc:h2:mem:devoluciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  autoconfigure:
    exclude: []

app:
  jwt:
    secret: test-secret-at-least-256-bits-long-0123456789abcdef0123456789
    expiration-minutes: 60
  carga:
    dir: ./cargas
    max-filas: 1000
