services:
  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: devoluciones
      POSTGRES_USER: devoluciones
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devoluciones"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/devoluciones
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [backend]

volumes:
  db_data:
